name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create wrapper if missing
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Force Build APK (Ignore All Errors)
        run: |
          ./gradlew assembleDebug --no-daemon || true
          ./gradlew assemble --no-daemon || true

      - name: Find and Upload Any APK
        uses: actions/upload-artifact@v4
        with:
          name: office-tools-apk
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/outputs/bundle/**/*.aab
